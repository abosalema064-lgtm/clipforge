<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clipforge</title>
<style>
:root{--bg:#e8e6e1;--ink:#15171a;--mut:#6b6e73;--card:#f7f6f3;--line:#c9c6bf;--red:#d93a26}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Iowan Old Style",Georgia,serif}
main{max-width:760px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:clamp(34px,8vw,56px);line-height:1.02;margin:10px 0 8px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 26px;max-width:46ch}
.panel{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;padding:18px}
.tabs{display:flex;gap:18px;border-bottom:1.5px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:8px 0;font:inherit;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px}
.tabs button.on{color:var(--ink);border-color:var(--red)}
input[type=text],input[type=number]{width:100%;padding:13px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;font:inherit}
.drop{display:block;padding:34px 14px;text-align:center;border:2px dashed var(--line);border-radius:4px;cursor:pointer;color:var(--mut)}
.drop b{color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.fmt{border:1.5px solid var(--line);border-radius:4px;padding:12px 6px;text-align:center;cursor:pointer;background:#fff;font:inherit}
.fmt i{display:block;margin:0 auto 6px;border:2px solid var(--ink);border-radius:2px}
.fmt.on{border-color:var(--red);box-shadow:inset 0 0 0 1.5px var(--red)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
label.f{display:block;font-size:14px;color:var(--mut)}
.chk{display:flex;gap:10px;font-size:14px;color:var(--mut);margin:8px 0}
.chk input{margin-top:5px;accent-color:var(--red)}
.go{width:100%;margin-top:10px;padding:15px;background:var(--red);color:#fff;border:0;border-radius:4px;font:700 17px inherit;cursor:pointer}
.go:disabled{background:#c9a39d;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:10px}
.bar div{height:100%;width:0;background:var(--red);transition:width .4s}
#status{margin-top:22px;display:none}
.err{color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;margin-top:22px}
.clip{background:var(--card);border:1.5px solid var(--ink);border-radius:6px;overflow:hidden}
.clip video{width:100%;display:block;background:#000;max-height:420px}
.clip div{padding:12px}
.clip h3{margin:0 0 4px;font-size:17px;line-height:1.25}
.clip p{margin:4px 0;font-size:14px;color:var(--mut)}
.score{float:right;background:var(--ink);color:#fff;border-radius:3px;padding:1px 8px;font:700 14px system-ui}
.acts{display:flex;gap:8px;margin-top:10px}
.acts a,.acts button{flex:1;text-align:center;padding:8px;border:1.5px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);font:600 14px system-ui;text-decoration:none;cursor:pointer}
</style></head><body><main>
<h1>Long video in.<br>Shorts out.</h1>
<p class="sub">Paste a link or upload a video. Clipforge finds the moments worth posting, crops them to size and adds captions.</p>
<section class="panel">
 <div class="tabs"><button class="on" data-t="url">Video link</button><button data-t="file">Upload file</button></div>
 <div id="t-url"><input type="text" id="url" placeholder="https://youtube.com/watch?v=..." inputmode="url"></div>
 <div id="t-file" hidden><label class="drop" id="drop"><input type="file" id="file" accept="video/*" hidden><b>Choose a video</b><br><span id="fname">MP4 or MOV</span></label></div>
 <div class="row" id="fmts">
  <button class="fmt on" data-f="9:16"><i style="width:18px;height:30px"></i>9:16 Shorts, Reels, TikTok</button>
  <button class="fmt" data-f="1:1"><i style="width:26px;height:26px"></i>1:1 Feed posts</button>
  <button class="fmt" data-f="16:9"><i style="width:34px;height:20px"></i>16:9 YouTube</button>
 </div>
 <div class="opts">
  <label class="f">Number of clips (0 = about 1 per minute)<input type="number" id="clips" value="0" min="0" max="15"></label>
  <label class="f">Longest clip (seconds)<input type="number" id="maxlen" value="60" min="20" max="90"></label>
 </div>
 <label class="chk"><input type="checkbox" id="caps" checked> Burn in captions</label>
 <label class="chk"><input type="checkbox" id="own"> I own this content or have the rights to clip and post it.</label>
 <button class="go" id="go" disabled>Generate clips</button>
</section>
<section id="status" class="panel"><b id="stage"></b><div class="bar"><div id="pb"></div></div><p class="err" id="err"></p></section>
<div class="grid" id="out"></div>
</main>
<script>
const $=s=>document.querySelector(s);let tab="url",fmt="9:16",busy=false;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
 $("#t-url").hidden=tab!=="url";$("#t-file").hidden=tab!=="file";check()});
document.querySelectorAll(".fmt").forEach(b=>b.onclick=()=>{fmt=b.dataset.f;
 document.querySelectorAll(".fmt").forEach(x=>x.classList.toggle("on",x===b))});
$("#file").onchange=e=>{$("#fname").textContent=e.target.files[0]?.name||"MP4 or MOV";check()};
["url","own"].forEach(i=>$("#"+i).addEventListener("input",check));
function check(){const ok=tab==="url"?$("#url").value.trim():$("#file").files[0];$("#go").disabled=busy||!(ok&&$("#own").checked)}
$("#go").onclick=async()=>{
 const fd=new FormData();
 if(tab==="url")fd.append("url",$("#url").value.trim());else fd.append("file",$("#file").files[0]);
 fd.append("fmt",fmt);fd.append("clips",$("#clips").value||0);fd.append("max_len",$("#maxlen").value||60);fd.append("captions",$("#caps").checked);
 busy=true;check();$("#out").innerHTML="";$("#err").textContent="";$("#status").style.display="block";$("#stage").textContent="Uploading";$("#pb").style.width="2%";
 try{const r=await fetch("/api/jobs",{method:"POST",body:fd});if(!r.ok)throw new Error((await r.json()).detail||"Request failed");
  poll((await r.json()).id)}catch(e){fail(e.message)}};
function fail(m){$("#err").textContent=m;busy=false;check()}
async function poll(id){
 const j=await (await fetch("/api/jobs/"+id)).json();
 $("#stage").textContent=j.stage;$("#pb").style.width=j.progress+"%";
 if(j.status==="error")return fail(j.error);
 if(j.status==="done"){busy=false;check();show(j.clips);return}
 setTimeout(()=>poll(id),1500)}
function show(cs){
 if(!cs.length){$("#err").textContent="No clips found. Try a longer video with speech.";return}
 $("#out").innerHTML=cs.map(c=>`<article class="clip"><video src="${c.file}" controls playsinline preload="metadata"></video><div>
 <span class="score">${c.score}</span><h3>${esc(c.title)}</h3><p>${esc(c.hook)}</p><p>${esc(c.reason)}</p>
 <div class="acts"><a href="${c.file}" download>Download</a><button data-c="${esc(c.hook+"\n"+c.title)}">Copy caption</button></div></div></article>`).join("");
 document.querySelectorAll(".acts button").forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(b.dataset.c);b.textContent="Copied";setTimeout(()=>b.textContent="Copy caption",1200)})}
</script></body></html>
